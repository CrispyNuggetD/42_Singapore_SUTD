name: Publish 42 portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install shell test dependency
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m pip install Markdown==3.7
      - run: PYTHONPATH=tools python -m unittest discover -s tests
      - run: PYTHONPATH=tools python -m unittest discover -s 'Shell automations/gobreak'
      - run: PYTHONPATH=tools python -m unittest discover -s 'Shell automations/apps'
      - run: python tools/portfolio.py build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
